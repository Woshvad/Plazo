name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Arc gate runs daily. Arc is someone else's network: an upgrade, a pause or
  # a changed limit should surface on a schedule, not on whenever someone next
  # opens a pull request.
  schedule:
    - cron: "0 6 * * *"
  # The vertical slice spends real testnet USDC, so it is triggered rather than
  # scheduled.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: default

jobs:
  boundaries:
    name: Licence and design boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The licence posture — protocol contracts and strip tooling open, operator
      # services proprietary — is only real if the code respects it. A policy
      # document would not survive the first deadline.
      - run: node tools/check-boundaries.mjs
      - run: node tools/check-design-tokens.mjs

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, never nightly. A compiler or behaviour change mid-audit is a
          # self-inflicted wound.
          version: v1.7.1

      - name: Vendor Solidity dependencies at pinned commits
        run: bash tools/install-libs.sh

      - run: forge --version
      - run: forge fmt --check --root contracts
      - run: forge build --root contracts --sizes

      # Excludes the fork suite, which needs a live RPC. It runs in `arc-gate`.
      - name: Test
        run: forge test --root contracts --no-match-path 'test/fork/*' -vv

      # A deeper campaign than the default profile. The plan invariants are what the
      # Phase 9 formal-verification specification is written against, and a shallow
      # fuzz that never reaches a delinquency proves nothing about either.
      - name: Invariant campaign
        run: FOUNDRY_PROFILE=deep forge test --root contracts --match-path 'test/invariant/*' -vv

      - name: Gas snapshot
        run: forge snapshot --root contracts --no-match-path 'test/fork/*'

      - uses: actions/upload-artifact@v4
        with:
          name: corpora
          path: contracts/corpus/*.json

  parity:
    name: Solidity to TypeScript derivation parity
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: bash tools/install-libs.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Regenerated here rather than downloaded, so the corpus and the TypeScript
      # under test come from the same commit. A stale artefact would let a
      # divergence pass.
      # Regenerated here rather than downloaded, so the corpora and the TypeScript
      # under test come from the same commit. Both are covered: identity and clone
      # address from Phase 1, and the terms commitment, schedule, authorization
      # windows and acceptance digest that a borrower's wallet builds from them.
      - name: Generate the corpora from Solidity
        run: |
          forge test --root contracts --match-test test_writeCorpus
          forge test --root contracts --match-test test_writeStripCorpus

      - name: Assert TypeScript reproduces them bit for bit
        run: pnpm --filter @plazo/plan-core test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Every package, not a hand-maintained list. Phase 1 wired `test` but not
      # `typecheck`, and three packages had been failing it unnoticed ever since —
      # a list is something to forget to add to.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  arc-gate:
    name: Arc mainnet-readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plazo/plan-core build

      # Twenty-five assertions against the live network: EIP-3009 typehashes,
      # payee enforcement, validity windows, the derived domain separator, the
      # pinned USDC implementation, EURC's corridor capability, USYC's deliberate
      # lack of one, and the eth_getLogs range the indexer chunks against.
      #
      # When Arc mainnet exists this same job runs with --network mainnet. That is
      # the whole mainnet plan: a config entry and a re-run. There is no mainnet
      # phase, because Arc mainnet is not live and has no announced date.
      - name: Verify Arc primitives
        run: pnpm arc:verify
        env:
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}

  fork-spike:
    name: Arc fork behaviour
    runs-on: ubuntu-latest
    # Depends on a third-party RPC. It must not be able to redden the build on a
    # network hiccup, but it must be visible when Arc's behaviour actually changes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: bash tools/install-libs.sh
      - name: Fork tests
        run: forge test --root contracts --match-path 'test/fork/*' -vv
        env:
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}

  slice:
    name: Vertical slice against live Arc
    runs-on: ubuntu-latest
    # Manual, because it spends real testnet USDC from a funded key and originates
    # real plans. The Foundry integration test proves the logic on every push; this
    # proves the token, which is the half no local test can reach — Arc USDC moves
    # through a native precompile Foundry cannot execute.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: bash tools/install-libs.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plazo/plan-core build

      - name: Deploy
        run: |
          forge script script/Deploy.s.sol --root contracts --rpc-url arc_testnet --broadcast
          node tools/record-deployment.mjs 5042002
        env:
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.PLAZO_TESTNET_DEPLOYER_KEY }}

      - name: Run the slice
        run: pnpm --filter @plazo/arc-verify slice
        env:
          ARC_TESTNET_RPC_URL: ${{ secrets.ARC_TESTNET_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.PLAZO_TESTNET_DEPLOYER_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: contracts/deployments/*.json

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: bash tools/install-libs.sh
      - uses: crytic/slither-action@v0.4.1
        continue-on-error: true
        with:
          target: contracts/
          slither-args: --exclude-dependencies --filter-paths "lib/|test/"
