[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned deliberately. Arc targets Osaka, a Prague superset, so Prague bytecode is
# guaranteed valid while staying reproducible under local forge and third-party
# fork tooling. Do not bump either of these without re-running the audit gate.
solc_version = "0.8.30"
evm_version = "prague"

optimizer = true
optimizer_runs = 1000

# Turned on in Phase 5 (DEC-30). `TranchedCreditPool` is a credit book, a tranche
# structure, an epoch accountant and a redemption queue in one contract, because
# splitting it would put one balance sheet in two places — and Phase 3 already shipped
# that bug once. Through the legacy pipeline it lands ~2 kB over EIP-170.
#
# The IR pipeline is the standard answer to that, and it is not only a size fix: every
# contract in the tree got smaller and cheaper, `InstallmentPlan` by about 11%. The
# cost is a slower cold build, which is a build-time problem rather than a design one —
# the alternative was contorting the architecture around a bytecode ceiling.
via_ir = true

bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [
    { access = "read-write", path = "./corpus" },
    { access = "read", path = "./out" },
]

gas_reports = ["*"]

[lint]
# `block-timestamp` fires on every comparison in a contract whose entire subject is
# dated obligations. Grace is three days and charge-off is sixty; a validator moving
# the clock by the seconds Arc's BFT consensus permits cannot reach either, and the
# alternative — block numbers — would make a borrower's due date depend on how fast
# the chain happened to run. Silenced globally so a warning that appears means
# something.
exclude_lints = ["block-timestamp"]

[profile.default.fuzz]
runs = 512
max_test_rejects = 100000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

# Deeper campaign for CI and for the pre-audit gate.
[profile.deep.fuzz]
runs = 10000

[profile.deep.invariant]
runs = 2048
depth = 256

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api", chain = 5042002 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first_multi"
quote_style = "double"
number_underscore = "thousands"
